@media(max-width:700px){header .wrap{gap:12px}.brand{flex-wrap:wrap}nav{gap:4px;scrollbar-width:thin}nav a{padding:8px 10px;font-size:13px}.main .wrap{padding-top:25px}main .wrap{padding-top:26px}.hero{margin-left:-2px;margin-right:-2px}.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}.card{border-radius:15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
